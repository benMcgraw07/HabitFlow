
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HabitFlow</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="app">

        <header class="app-header">
            <h1>HabitFlow</h1>
            <p id="current-date"></p>
        </header>

        <main>
            <!-- Today Screen -->
            <section id="today-screen" class="screen">
                <h2>Today's Habits</h2>

                <div id="today-habits"></div>

                <div class="daily-progress">
                    <p>Daily Progress: <span id="progress-count">0/0</span></p>
                    <progress id="daily-progress-bar" value="0" max="1"></progress>
                </div>
            </section>

            <!-- My Habits Screen -->
            <section id="habits-screen" class="screen" hidden>
                <h2>My Habits</h2>

                <button id="add-habit-button" type="button">
                    + Add New Habit
                </button>

                <div id="habits-list"></div>
            </section>

            <!-- Progress Screen -->
            <section id="progress-screen" class="screen" hidden>
                <h2>Progress</h2>

                <div id="weekly-statistics"></div>
                <div id="weekly-chart"></div>
            </section>

            <!-- Settings Screen -->
            <section id="settings-screen" class="screen" hidden>
                <h2>Settings</h2>

                <h3>Appearance</h3>
                <label>
                    <input type="checkbox" id="dark-mode-toggle">
                    Dark Mode
                </label>

                <h3>Data Management</h3>
                <button id="export-data-button" type="button">
                    Export Habit Data
                </button>
                <button id="reset-progress-button" type="button">
                    Reset All Progress
                </button>

                <h3>Notifications</h3>
                <label>
                    <input type="checkbox" id="reminders-toggle">
                    Daily Reminders
                </label>

                <label for="reminder-time">Reminder Time</label>
                <input type="time" id="reminder-time" value="09:00">
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Main navigation">
            <button type="button" class="nav-button active"
                    data-screen="today-screen" aria-current="page">
                Today
            </button>

            <button type="button" class="nav-button"
                    data-screen="habits-screen">
                My Habits
            </button>

            <button type="button" class="nav-button"
                    data-screen="progress-screen">
                Progress
            </button>

            <button type="button" class="nav-button"
                    data-screen="settings-screen">
                Settings
            </button>
        </nav>

    </div>
</body>
</html>
