
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HabitFlow</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="app">

        <header class="app-header">
            <h1>HabitFlow</h1>
            <p id="current-date"></p>
        </header>

        <main>
            <!-- Today Screen -->
            
            <section id="today-screen" class="screen">
                <div class="today-header">
                    <p class="section-eyebrow">YOUR DAILY ROUTINE</p>
                    <h2>Today's Habits</h2>
                    <p class="section-description">
                        Small steps make a big difference.
                    </p>
                </div>


                
                <!-- Daily progress summary -->
                <div class="daily-progress">
                    <p>Daily Progress: <span id="progress-count">0/0</span></p>
                    <progress id="daily-progress-bar" value="0" max="1"></progress>
                </div>

                <!-- Today's scheduled habits -->
                <div id="today-habits"></div>

            </section>

            <!-- My Habits Screen -->
            <section id="habits-screen" class="screen" hidden>
                <h2>My Habits</h2>

                <button id="add-habit-button" type="button">
                    + Add New Habit
                </button>


                <!-- Add / Edit Habit Form -->
                <form id="habit-form" hidden>
                    <h3 id="form-title">Add New Habit</h3>

                    <label for="habit-name">Habit Name</label>
                    <input
                        type="text"
                        id="habit-name"
                        name="habit-name"
                        placeholder="e.g. Read for 20 minutes"
                        maxlength="60"
                        required
                    >

                    <fieldset>
                        <legend>Repeat on</legend>

                        <div class="weekday-options">
                            <label><input type="checkbox" name="weekdays" value="1"> Mon</label>
                            <label><input type="checkbox" name="weekdays" value="2"> Tue</label>
                            <label><input type="checkbox" name="weekdays" value="3"> Wed</label>
                            <label><input type="checkbox" name="weekdays" value="4"> Thu</label>
                            <label><input type="checkbox" name="weekdays" value="5"> Fri</label>
                            <label><input type="checkbox" name="weekdays" value="6"> Sat</label>
                            <label><input type="checkbox" name="weekdays" value="0"> Sun</label>
                        </div>
                    </fieldset>

                    <p id="habit-form-error" role="alert" hidden>
                        Please select at least one weekday.
                    </p>

                    <div class="form-actions">
                        <button type="submit" id="save-habit-button">Save Habit</button>
                        <button type="button" id="cancel-habit-button">Cancel</button>
                    </div>
                </form>

                <div id="habits-list"></div>
            </section>

            <!-- Progress Screen -->
            <section id="progress-screen" class="screen" hidden>
                <h2>Progress</h2>

                <!-- Weekly history navigation -->
                <div class="week-navigation"
                    role="group"
                    aria-label="Weekly history navigation">

                    <button
                        type="button"
                        id="previous-week-button"
                        aria-label="View previous week"
                        disabled
                    >
                        &larr;
                    </button>

                    <span id="selected-week-label" aria-live="polite">
                        This week
                    </span>

                    <button
                        type="button"
                        id="next-week-button"
                        aria-label="View next week"
                        disabled
                    >
                        &rarr;
                    </button>

                </div>

                <div id="weekly-statistics"></div>
                <div id="weekly-chart"></div>
            </section>


            <!-- Settings Screen -->
            <section id="settings-screen" class="screen" hidden>
                <h2>Settings</h2>

                <h3>Appearance</h3>
                <label>
                    <input type="checkbox" id="dark-mode-toggle">
                    Dark Mode
                </label>

                <h3>Data Management</h3>
                <button id="export-data-button" type="button">
                    Export Habit Data
                </button>
                <button id="reset-progress-button" type="button">
                    Reset All Progress
                </button>
<!--
                <h3>Notifications</h3>
                <label>
                    <input type="checkbox" id="reminders-toggle">
                    Daily Reminders
                </label>

                <label for="reminder-time">Reminder Time</label>
                <input type="time" id="reminder-time" value="09:00">-->
            </section>
        </main>


        <nav class="bottom-nav" aria-label="Main navigation">
            <button type="button" class="nav-button active"
                    data-screen="today-screen" aria-current="page">
                Today
            </button>

            <button type="button" class="nav-button"
                    data-screen="habits-screen">
                My Habits
            </button>

            <button type="button" class="nav-button"
                    data-screen="progress-screen">
                Progress
            </button>

            <button type="button" class="nav-button"
                    data-screen="settings-screen">
                Settings
            </button>
        </nav>

    </div>
</body>
</html>
